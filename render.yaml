services:
  - type: web
    name: survival-ai
    env: python
    buildCommand: pip install -r requirements.txt && playwright install chromium && python -m camoufox fetch
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: PAYONEER_WEBHOOK_SECRET
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      # Gates every stateful endpoint plus the read surface via
      # require_api_token (src/api_auth.py): all mutating endpoints
      # (/api/withdraw, /api/spend/{id}/reject, /api/debt/tick,
      # /api/research/trigger, /api/email/scan, /api/survival-mode) AND the
      # read state (/status, /api/spend/pending, /api/email/status,
      # /api/survival-mode GET, and the /ws WebSocket handshake) require a
      # valid token (Authorization header, uj_session cookie, or ?token=).
      # The check fails CLOSED (503) when this is unset, so those endpoints
      # are silently disabled on a fresh deploy until this is configured.
      # /health stays public as a bare-liveness probe with no agent state.
      - key: API_AUTH_TOKEN
        sync: false
      # §9/§15 brain_router LLM fallback chain (NVIDIA -> Groq -> Gemini ->
      # Mistral -> OpenRouter), already used as GitHub Actions secrets in
      # debt_clock.yml/research.yml — without these declared here too, the
      # fallback the risk register credits with mitigating NVIDIA rate
      # limits never actually triggers on the Render-hosted service.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # §10 Layer-2 public narrative diary (src/diary.py) — writes silently
      # no-op without this (same soft-dependency pattern as HF_TOKEN).
      - key: GITHUB_TOKEN
        sync: false
      # §14 real payouts (src/withdrawal.py) — withdrawals queue for manual
      # processing rather than actually paying out until both are set.
      - key: PAYONEER_API_KEY
        sync: false
      - key: PAYONEER_PROGRAM_ID
        sync: false
      # Email verification-link/payment-alert scanning (src/email_inbox.py).
      - key: EMAIL_IMAP_HOST
        sync: false
      - key: EMAIL_IMAP_PORT
        sync: false
      - key: EMAIL_IMAP_USER
        sync: false
      - key: EMAIL_IMAP_PASSWORD
        sync: false
      # §11/issue #63 optional survival mode: boot-time default only. Set to
      # "0" to run in normal earning mode (death permanently ends the agent);
      # "1" (default) enables reincarnation. The operator can still override
      # at runtime via GET/POST /api/survival-mode — that choice is persisted
      # in Supabase app_settings and wins over this env var on startup.
      - key: SURVIVAL_MODE
        value: "1"
      # §19/issue #59 paid CAPTCHA-solving — 2Captcha primary, Anti-Captcha
      # fallback (same as the other optional secrets: the ladder just stops
      # one rung earlier/GIVE_UP when neither is set). Anti-Captcha accepts
      # crypto top-ups, the practical card alternative in an India/Payoneer
      # setup.
      - key: TWOCAPTCHA_API_KEY
        sync: false
      - key: ANTICAPTCHA_API_KEY
        sync: false
      # Encrypts platform passwords at rest in the Supabase `credentials`
      # table (src/vault.py). REQUIRED for the live vault (issue #72):
      # the app refuses to boot if this is unset (fail-closed). Without it
      # the entire credential store — the agent's revenue asset — would sit
      # in plaintext, exposed by any Supabase read-access leak.
      - key: VAULT_ENCRYPTION_KEY
        sync: false